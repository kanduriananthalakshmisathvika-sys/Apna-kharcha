
{% extends "base.html" %}

{% block content %}

<style>
.expense-container {
    max-width: 650px;
    margin: 30px auto;
    padding: 30px;
    background: #fff7f4;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(255, 120, 100, 0.12);
}

.expense-container h2 {
    color: #e76f51;
    font-weight: bold;
    margin-bottom: 10px;
}

.expense-container label {
    color: #7b4141;
    font-weight: 600;
    margin-top: 15px;
}

.expense-container .form-control,
.expense-container .form-select {
    border-radius: 10px;
    padding: 11px;
    border: 1px solid #ffd1c2;
}

.expense-btn {
    background: linear-gradient(135deg, #ff8a65, #ff5e78);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-weight: bold;
    width: 100%;
    margin-top: 22px;
}

.expense-btn:hover {
    opacity: 0.9;
    color: white;
}
</style>

<div class="expense-container">

    <h2>🧡 Add New Expense</h2>
    <p>Keep track of where your money goes!</p>

    <form method="POST">

        <label>Amount (₹)</label>
        <input type="number"
               name="amount"
               class="form-control"
               placeholder="Enter amount"
               min="0.01"
               step="0.01"
               required>

        <label>Expense Category</label>
        <select name="category" class="form-select" required>
            <option value="">Select category</option>
            <option value="Food">🍕 Food</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Travel">🚕 Travel</option>
            <option value="Bills">💡 Bills</option>
            <option value="Education">📚 Education</option>
            <option value="Health">💊 Health</option>
            <option value="Entertainment">🎬 Entertainment</option>
            <option value="Rent">🏠 Rent</option>
            <option value="Other">✨ Other</option>
        </select>

        <label>Description</label>
        <textarea name="description"
                  class="form-control"
                  placeholder="What did you spend on?"
                  rows="3"></textarea>

        <label>Date</label>
        <input type="date"
               name="date"
               class="form-control"
               value="{{ today }}"
               required>

        <button type="submit" class="expense-btn">
            🧡 Save Expense
        </button>

    </form>

</div>

{% endblock %}
