
{% extends "base.html" %}

{% block title %}Login | Apna Karcha{% endblock %}

{% block content %}

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="text-center mb-4">
            <h2 class="fw-bold">🌸 Apna Karcha</h2>
            <p class="text-secondary">
                Welcome back! Manage your money.
            </p>
        </div>

        <h4 class="fw-bold mb-4">Login to Your Account</h4>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100 py-2">
                Login
            </button>

        </form>

        <p class="text-center mt-4 mb-0">
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Register here
            </a>
        </p>

    </div>
</div>

{% endblock %}
